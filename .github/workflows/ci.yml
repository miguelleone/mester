name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mester
          POSTGRES_PASSWORD: mester
          POSTGRES_DB: mester
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mester"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mester:mester@localhost:5432/mester
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate -w api
      - run: npm run build
