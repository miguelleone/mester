services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mester
      POSTGRES_PASSWORD: mester
      POSTGRES_DB: mester
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mester"]
      interval: 5s
      retries: 10

volumes:
  db-data:
